apiVersion: v1
kind: Service
metadata:
  name: {{ include "puppy-pics.fullname" . }}
  labels:
    {{- include "puppy-pics.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  loadBalancerSourceRanges:
    - {{ .Values.service.allowlist }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
      name: {{ .Values.service.portName }}
  selector:
    {{- include "puppy-pics.selectorLabels" . | nindent 4 }}
