name: repo-creation

on:
  push:
    branches: [ "**" ]

permissions:
  actions: write
  contents: write

jobs:
  Init_Creation:
    name: Initial Creation
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate gh CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Extract INITIALS And Set Makefile Variable File
        run: |
          REPO_NAME=$(basename "$(git rev-parse --show-toplevel)")
          INITIALS=$(echo "$REPO_NAME" | awk -F'-' '{print $NF}')
          echo "INITIALS=${INITIALS}" >> "$GITHUB_ENV"
          echo "INITIALS=${INITIALS}" > terraform/.makevars.mk

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/.makevars.mk
          git commit -m "Set INITIALS to ${{ env.INITIALS }}"
          git push

      - name: Disable this workflow
        run: gh workflow disable repo-creation.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
